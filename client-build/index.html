    <script>
      (function () {
        // Clear any stale Service Workers that could trap old assets in the browser
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function () {});
        }
        // Clear any browser Cache Storage instances from earlier visits
        if ('caches' in window) {
          try {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function () {});
          } catch (e) {}
        }

        // Live production safeguard for cPanel Apache / LiteSpeed hosting:
        // When running in production (no Vite dev server present), ensure compiled bundle loads
        var isViteDev = !!document.querySelector('script[src*="@vite/client"]') || 
                        !!document.querySelector('script[src*="/@vite/client"]') ||
                        (window.location.port === '3000' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'));
        if (!isViteDev) {
          setTimeout(function() {
            if (!window.__SPINEL_MOUNTED__) {
              var bust = Date.now();
              var js = document.createElement('script');
              js.type = 'module';
              js.crossOrigin = 'anonymous';
              js.src = '/assets/index.js?v=' + bust;
              document.body.appendChild(js);
            }
          }, 40);
        }
      })();
    </script>
