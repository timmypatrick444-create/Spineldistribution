<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/bmv4hvtk/image/upload/v1788619290/Spinel_Distribution.jpg" />
    <title>SPINEL DISTRIBUTION - International E-Commerce & Security Systems</title>
    <meta name="description" content="International enterprise e-commerce platform for video surveillance, access control, networking, telecommunications, and renewable energy." />
    <meta property="og:title" content="SPINEL DISTRIBUTION - International E-Commerce & Security Systems" />
    <meta property="og:description" content="International enterprise e-commerce platform for video surveillance, access control, networking, telecommunications, and renewable energy." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Prevent stale browser caching on live cPanel deployments -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Paystack Inline JS for seamless live payment -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </head>
  <body class="bg-[#eaeded] text-[#0F1111] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatic fallback if raw repository index.html is ever served directly by Apache/LiteSpeed without Vite dev server
      (function () {
        var isRawDevHtml = !!document.querySelector('script[src*="/src/main.tsx"]');
        var hasViteClient = !!document.querySelector('script[src*="@vite/client"]');
        if (!isRawDevHtml || hasViteClient) return;
        window.addEventListener('load', function () {
          setTimeout(function () {
            var rootEl = document.getElementById('root');
            if (rootEl && rootEl.childNodes.length === 0) {
              fetch('/client-build/index.html?_t=' + Date.now(), { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.text() : fetch('/dist/index.html?_t=' + Date.now(), { cache: 'no-store' }).then(function (r2) { return r2.text(); }); })
                .then(function (html) {
                  if (!html || html.indexOf('/assets/') === -1) return;
                  var doc = new DOMParser().parseFromString(html, 'text/html');
                  doc.querySelectorAll('link[rel="stylesheet"]').forEach(function (link) {
                    var newLink = document.createElement('link');
                    newLink.rel = 'stylesheet';
                    newLink.href = link.getAttribute('href');
                    document.head.appendChild(newLink);
                  });
                  doc.querySelectorAll('script[type="module"]').forEach(function (scr) {
                    var src = scr.getAttribute('src');
                    if (src && src.indexOf('/src/main.tsx') === -1) {
                      var newScr = document.createElement('script');
                      newScr.type = 'module';
                      newScr.src = src;
                      document.head.appendChild(newScr);
                    }
                  });
                })
                .catch(function () {});
            }
          }, 600);
        });
      })();
    </script>
  </body>
</html>
