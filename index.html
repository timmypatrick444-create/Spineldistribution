<!doctype html>
<html lang="en" style="background-color: #eaeded; color: #0F1111;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/bmv4hvtk/image/upload/v1794363298/Spinel_White_Short_Logo_With_Orange_Smile.png" />
    <title>SPINEL DISTRIBUTION - International E-Commerce & Security Systems</title>
    <meta name="description" content="International enterprise e-commerce platform for video surveillance, access control, networking, telecommunications, and fiber optic cabling." />
    <meta property="og:title" content="SPINEL DISTRIBUTION - International E-Commerce & Security Systems" />
    <meta property="og:description" content="International enterprise e-commerce platform for video surveillance, access control, networking, telecommunications, and fiber optic cabling." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Prevent stale browser caching on live cPanel deployments -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Paystack Inline JS for seamless live payment -->
    <script src="https://js.paystack.co/v1/inline.js" defer></script>
  </head>
  <body class="bg-[#eaeded] text-[#0F1111] antialiased" style="background-color: #eaeded; color: #0F1111; margin: 0; padding: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div id="root">
      <div id="spinel-initial-loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#131921;background-color:#eaeded;">
        <div style="font-size:22px;font-weight:900;letter-spacing:1px;color:#131921;margin-bottom:8px;">SPINEL DISTRIBUTION</div>
        <div style="font-size:14px;color:#565959;">Loading international storefront...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        // Clear any stale Service Workers that could trap old assets in the browser
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          }).catch(function () {});
        }
        // Clear any browser Cache Storage instances from earlier visits
        if ('caches' in window) {
          try {
            caches.keys().then(function (keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function () {});
          } catch (e) {}
        }
      })();
    </script>
  </body>
</html>
