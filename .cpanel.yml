---
# =====================================================================
# cPanel Git Version Control Automated Deployment Configuration
# =====================================================================
# How to use:
# 1. In cPanel, navigate to: "Git™ Version Control"
# 2. Clone or link your repository to your cPanel hosting account.
# 3. When you push changes or click "Update from Remote", cPanel reads
#    this file and automatically runs npm install, compiles the project,
#    and restarts Phusion Passenger. Zero manual zip uploads required!
# =====================================================================

deployment:
  tasks:
    - export DEPLOYPATH=$(pwd)
    - echo "Deploying Spinel Distribution in $DEPLOYPATH..."
    - export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
    - |
      if command -v npm >/dev/null 2>&1; then
        echo "npm detected in environment. Attempting safe build..."
        npm run build || echo "[Notice] Build step skipped or failed; using repository pre-built production assets."
      else
        echo "[Notice] npm not found in standard PATH; using repository pre-built production assets."
      fi
    - mkdir -p tmp
    - touch tmp/restart.txt
    - echo "Spinel Distribution successfully deployed and Passenger reloaded on cPanel!"
