---
# =====================================================================
# cPanel Git Version Control Automated Deployment Configuration
# =====================================================================
# How to use:
# 1. In cPanel, navigate to: "Git™ Version Control"
# 2. Clone or link your repository to your cPanel hosting account.
# 3. When you push changes or click "Update from Remote", cPanel reads
#    this file and automatically runs npm install, compiles the project,
#    and restarts Phusion Passenger. Zero manual zip uploads required!
# =====================================================================

deployment:
  tasks:
    - |
      if [ -d "$HOME/public_html" ]; then
        TARGET="$HOME/public_html"
      elif [ -d "/home/$USER/public_html" ]; then
        TARGET="/home/$USER/public_html"
      elif [ -d "../public_html" ]; then
        TARGET="../public_html"
      else
        TARGET="$(pwd)"
      fi
      echo "Deploying Spinel Distribution production build to $TARGET..."

      if [ "$TARGET" != "$(pwd)" ]; then
        echo "Syncing production bundles to $TARGET..."
        /bin/cp -rf dist "$TARGET/" 2>/dev/null || true
        /bin/cp -rf client-build "$TARGET/" 2>/dev/null || true
        /bin/cp -rf assets "$TARGET/" 2>/dev/null || true
        /bin/cp -rf Images "$TARGET/" 2>/dev/null || true
        /bin/cp -f dist/index.html "$TARGET/index.html" 2>/dev/null || /bin/cp -f index.html "$TARGET/index.html"
        /bin/cp -f .htaccess "$TARGET/.htaccess" 2>/dev/null || true
        /bin/cp -f app.js "$TARGET/app.js" 2>/dev/null || true
        /bin/cp -f server.cjs "$TARGET/server.cjs" 2>/dev/null || true
        /bin/cp -f package.json "$TARGET/package.json" 2>/dev/null || true
        /bin/cp -f build-version.json "$TARGET/build-version.json" 2>/dev/null || true
        /bin/cp -f cpanel-deploy.zip "$TARGET/cpanel-deploy.zip" 2>/dev/null || true
      else
        echo "Repository is located directly inside $TARGET."
        /bin/cp -f dist/index.html "$TARGET/index.html" 2>/dev/null || true
      fi

      mkdir -p "$TARGET/tmp"
      touch "$TARGET/tmp/restart.txt"
      echo "Spinel Distribution deployment to $TARGET completed successfully!"
